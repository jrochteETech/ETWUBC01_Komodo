services:
  ignition-buildathon:
    image: inductiveautomation/ignition:8.3.4
    ports:
      - "8091:8088"   # HTTP
      - "8045:8043"   # HTTPS
      # - "8060:8060"   # GAN
      # - "62541:62541" # OPC
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      IGNITION_EDITION: "standard"
      DISABLE_QUICKSTART: true
      GATEWAY_ADMIN_USERNAME: "admin"
      GATEWAY_ADMIN_PASSWORD: "password"
    command: >
      -n ignition-buildathon
      -a 10.21.2.156
      -h 8091
      -s 8045
    volumes:
      - ignition-buildathon-data3:/usr/local/bin/ignition/data
      - ./ignition.conf:/usr/local/bin/ignition/data/ignition.conf
    networks:
      - ignition-buildathon

volumes:
  ignition-buildathon-data3:
    driver: local

networks:
  ignition-buildathon: